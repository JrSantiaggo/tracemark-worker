name: tracemark-worker

services:
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: tracemark-sqs
    restart: unless-stopped
    ports:
      - "${SQS_LOCAL_PORT:-9324}:9324"
      - "9325:9325"
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:9324/?Action=ListQueues' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Use apenas se o emulador S3 do tracemark-api não estiver rodando (mesma porta).
  s3:
    image: chrislusf/seaweedfs:4.50
    container_name: tracemark-worker-s3
    profiles: ["storage"]
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64 -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?defina AWS_ACCESS_KEY_ID no .env para o emulador local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?defina AWS_SECRET_ACCESS_KEY no .env para o emulador local}
    ports:
      - "${S3_LOCAL_PORT:-8333}:8333"
    volumes:
      - s3-data:/data

volumes:
  s3-data:
