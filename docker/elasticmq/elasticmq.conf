include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  tracemark-photo-processing-dlq {}

  tracemark-photo-processing {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "tracemark-photo-processing-dlq"
      maxReceiveCount = 3
    }
  }
}
